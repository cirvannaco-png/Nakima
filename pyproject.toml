[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nakima"
version = "1.0.0"
description = "Autonomous AI-powered GitHub App: plans, generates, validates, and opens PRs from issues."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Nakima Contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Framework :: FastAPI",
  "License :: Other/Proprietary License",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Security",
]
dynamic = ["dependencies", "optional-dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
optional-dependencies.dev = { file = ["requirements-dev.txt"] }

[tool.setuptools.packages.find]
where = ["."]
include = [
  "agents*", "api*", "core*", "database*", "documents*", "execution*",
  "githubapp*", "intelligence*", "memory*", "models*", "monitoring*",
  "neis*", "orchestrator*", "planner*", "providers*", "quality*",
  "reports*", "repository*", "security*", "utils*", "validation*",
]
exclude = ["tests*", "alembic*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["E501", "S101", "S603", "S607"]

[tool.bandit]
exclude_dirs = ["tests", "alembic/versions"]
skips = ["B101"]
