[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nakima"
version = "0.1.0"
description = "Autonomous GitHub App that plans, generates, validates and opens PRs from issues."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Nakima Contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
]
dynamic = ["dependencies", "optional-dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
optional-dependencies.dev = { file = ["requirements-dev.txt"] }

[tool.setuptools.packages.find]
where = ["."]
include = [
  "agents*", "api*", "core*", "database*", "documents*", "execution*",
  "githubapp*", "intelligence*", "memory*", "models*", "monitoring*",
  "neis*", "orchestrator*", "planner*", "providers*", "quality*",
  "reports*", "repository*", "security*", "utils*", "validation*",
]
exclude = ["tests*", "alembic*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
