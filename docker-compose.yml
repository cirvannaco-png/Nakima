version: '3.8'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: nakima
      POSTGRES_PASSWORD: nakima
      POSTGRES_DB: nakima
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nakima"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    image: nakima-sandbox:latest
    # This service never runs standalone — SandboxExecutor launches
    # short-lived containers from this image on demand. Building it here
    # just makes `docker-compose build` produce it as part of one command.
    entrypoint: ["true"]

  clamav:
    image: clamav/clamav:stable
    # ClamAV starts freshclam (signature downloader) and clamd (scanner
    # daemon) in the same container. First startup is slow (~1 min) while
    # the initial virus database is downloaded. Subsequent starts reuse
    # the volume cache and are fast.
    # Set CLAMD_HOST=clamav in your .env (or the app service environment
    # below) to activate VirusScanner; omitting it leaves the scanner in
    # "unavailable" / fail-open mode per security/virus_scanner.py design.
    ports:
      - "3310:3310"
    volumes:
      - clamav_db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 120s  # freshclam download on first run

  app:
    build: .
    command: uvicorn api.router:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://nakima:nakima@db:5432/nakima
      - REDIS_URL=redis://redis:6379/0
      - CLAMD_HOST=clamav
      - CLAMD_PORT=3310
    volumes:
      - ./:/app
      - /var/run/docker.sock:/var/run/docker.sock  # app needs to spawn sandbox containers
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      sandbox:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy

volumes:
  pgdata:
  clamav_db:
