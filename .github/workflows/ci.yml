name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # --- Lint & type-check ---
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dev deps
        run: pip install -r requirements-dev.txt
      - name: Ruff (format + lint)
        run: ruff check . && ruff format --check .
      - name: Flake8
        run: flake8 . --max-line-length=120 --exclude=alembic/versions,__pycache__,.git --extend-ignore=E501,W503

  # --- SAST ---
  sast:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install bandit
        run: pip install bandit==1.8.5
      - name: Run bandit
        continue-on-error: true
        run: bandit -r . -x alembic/versions,tests -ll -f txt

  # --- Dependency audit ---
  audit:
    name: Dependency Audit (safety)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install safety
        run: pip install safety==3.8.1
      - name: Audit dependencies
        continue-on-error: true
        run: safety check -r requirements.txt

  # --- Tests ---
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nakima
          POSTGRES_PASSWORD: nakima
          POSTGRES_DB: nakima
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://nakima:nakima@localhost:5432/nakima
      GITHUB_APP_ID: "123456"
      GITHUB_PRIVATE_KEY: "test-private-key-not-real"
      GITHUB_WEBHOOK_SECRET: "testsecret"
      GITHUB_TOKEN: "ghp-test"
      DEFAULT_AI_PROVIDER: "github"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Verify Git binary
        run: git --version
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run migrations
        run: alembic upgrade head
      - name: Test (with coverage)
        run: pytest --tb=short -q --cov=. --cov-report=term-missing --cov-fail-under=80

  # --- Diff-review frontend ---
  diff-review:
    name: Diff Review Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nakima_diff_review
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: nakima_diff_review/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build

  # --- Docker build ---
  docker:
    name: Docker Build
    needs: diff-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: nakima:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build sandbox image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.sandbox
          push: false
          tags: nakima-sandbox:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --- Container vulnerability scan (Trivy) ---
  # Scans both shipped images for OS + library CVEs. Findings are uploaded to
  # GitHub code scanning and the job fails on fixable CRITICAL/HIGH issues.
  trivy:
    name: Container Scan (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            dockerfile: Dockerfile
            blocking: "true"
          - name: sandbox
            dockerfile: Dockerfile.sandbox
            # The sandbox image intentionally carries a wider toolchain; its
            # CVEs are reported to code scanning but do not block the pipeline.
            blocking: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: nakima-${{ matrix.name }}:trivy
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Full report (all severities) for triage, never fails the build.
      - name: Trivy report (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "nakima-${{ matrix.name }}:trivy"
          format: "sarif"
          output: "trivy-${{ matrix.name }}.sarif"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH,MEDIUM"

      - name: Upload SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-${{ matrix.name }}.sarif"
          category: "trivy-${{ matrix.name }}"

      - name: Upload scan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.name }}-sarif
          path: "trivy-${{ matrix.name }}.sarif"
          if-no-files-found: warn

      # Gate: fixable CRITICAL/HIGH CVEs block the pipeline.
      - name: Trivy gate (CRITICAL/HIGH)
        continue-on-error: ${{ matrix.blocking != 'true' }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "nakima-${{ matrix.name }}:trivy"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          skip-setup-trivy: true

  # --- Dockerfile / IaC misconfiguration scan ---
  trivy-config:
    name: Container Config Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Dockerfiles are clean; other IaC in the repo still has open findings, so
      # this reports without blocking until they are triaged.
      - name: Scan Dockerfiles for misconfigurations (blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "config"
          scan-ref: "Dockerfile"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"

      - name: Scan all IaC for misconfigurations (report only)
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "config"
          scan-ref: "."
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          skip-setup-trivy: true
