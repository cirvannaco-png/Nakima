name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:

permissions:
  contents: read

jobs:
  # ─── Lint & type-check ──────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dev deps
        run: pip install -r requirements-dev.txt
      - name: Ruff (format + lint)
        run: ruff check . && ruff format --check .
      - name: Flake8
        run: flake8 . --max-line-length=120 --exclude=alembic/versions,__pycache__,.git --extend-ignore=E501,W503

  # ─── SAST ───────────────────────────────────────────────────────────────────
  sast:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install bandit
        run: pip install bandit==1.8.5
      - name: Run bandit
        run: bandit -r . -x alembic/versions,tests -ll -f txt || true

  # ─── Dependency audit ───────────────────────────────────────────────────────
  audit:
    name: Dependency Audit (safety)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install safety
        run: pip install safety==3.5.1
      - name: Audit dependencies
        run: safety check -r requirements.txt || true

  # ─── Tests ──────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nakima
          POSTGRES_PASSWORD: nakima
          POSTGRES_DB: nakima
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://nakima:nakima@localhost:5432/nakima
      GITHUB_APP_ID: "123456"
      GITHUB_PRIVATE_KEY: "test-private-key-not-real"
      GITHUB_WEBHOOK_SECRET: "testsecret"
      GITHUB_TOKEN: "ghp-test"
      DEFAULT_AI_PROVIDER: "github"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run migrations
        run: alembic upgrade head
      - name: Test (with coverage)
        run: pytest --tb=short -q --cov=. --cov-report=term-missing --cov-fail-under=60

  # ─── Docker build ───────────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: nakima:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build sandbox image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.sandbox
          push: false
          tags: nakima-sandbox:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Security scan (Trivy) ──────────────────────────────────────────────────
  trivy:
    name: Container Scan (Trivy)
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v4
      - name: Build image for scanning
        run: docker build -t nakima:trivy .
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "nakima:trivy"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
