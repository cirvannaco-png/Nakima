name: Deploy

# Runs only after CI succeeds on main, so a broken build can never ship.
# A failed post-deploy health check automatically rolls production back to the
# previous known-good container image.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: Publish container image (GHCR)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      previous: ${{ steps.previous.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Captured before the new push so the rollback job knows what "last
      # known-good" means.
      - name: Record current production digest
        id: previous
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          if [ -n "$digest" ]; then
            echo "::notice::Previous production image $digest recorded for rollback."
          else
            echo "::notice::No previous production image found - rollback will be skipped."
          fi

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scan:
    name: Scan published image (Trivy)
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy report (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:latest
          format: "sarif"
          output: "trivy-production.sarif"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH,MEDIUM"

      - name: Upload SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-production.sarif"
          category: "trivy-production"

      # Blocks the deploy when the image that would ship has fixable
      # CRITICAL/HIGH CVEs.
      - name: Trivy gate (CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:latest
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          skip-setup-trivy: true

  render:
    name: Trigger Render deploy
    needs: [image, scan]
    runs-on: ubuntu-latest
    environment: production
    steps:
      # No-op (not a failure) until RENDER_DEPLOY_HOOK_URL is configured in the
      # repository's "production" environment secrets.
      - name: Check deploy hook
        id: hook
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::RENDER_DEPLOY_HOOK_URL is not set - skipping hosted deploy."
          fi

      - name: Deploy to Render
        if: steps.hook.outputs.configured == 'true'
        run: |
          code=$(curl -sS -o /tmp/render.out -w '%{http_code}' -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          cat /tmp/render.out
          if [ "$code" -ge 400 ]; then
            echo "::error::Render deploy hook failed with HTTP $code"
            exit 1
          fi

      - name: Wait for health check
        if: steps.hook.outputs.configured == 'true' && vars.PRODUCTION_URL != ''
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "${{ vars.PRODUCTION_URL }}/health" > /dev/null; then
              echo "Production health check passed."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Production health check did not pass within 5 minutes."
          exit 1

  rollback:
    name: Rollback production
    needs: [image, scan, render]
    if: failure() && needs.image.outputs.previous != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Re-point :latest at the last known-good image
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:latest" \
            "$IMAGE@${{ needs.image.outputs.previous }}"
          echo "::warning::Production rolled back to ${{ needs.image.outputs.previous }}."

      - name: Check deploy hook
        id: hook
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Redeploy previous image
        if: steps.hook.outputs.configured == 'true'
        run: |
          curl -sS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" -o /tmp/rollback.out -w '%{http_code}\n'
          cat /tmp/rollback.out

      - name: Verify rollback health
        if: steps.hook.outputs.configured == 'true' && vars.PRODUCTION_URL != ''
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "${{ vars.PRODUCTION_URL }}/health" > /dev/null; then
              echo "Production healthy again after rollback."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Production is still unhealthy after rollback - manual intervention required."
          exit 1
