name: Code Quality

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # Install the same pinned ruff/flake8 the CI workflow uses so the two
      # pipelines can never disagree about what "clean" means.
      - name: Install tools
        run: |
          pip install "$(grep -E '^ruff==' requirements-dev.txt)" "$(grep -E '^flake8==' requirements-dev.txt)"

      - name: Check formatting (ruff)
        run: ruff format --check .

      - name: Run lint (ruff)
        run: ruff check .

      - name: Run lint (flake8)
        run: flake8 . --max-line-length=120 --exclude=alembic/versions,__pycache__,.git --extend-ignore=E501,W503
